version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: valhaus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: valhaus
      POSTGRES_USER: valhaus_user
      POSTGRES_PASSWORD: valhaus_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U valhaus_user -d valhaus" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ASP.NET MVC Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: valhaus-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__constr=Server=postgres;Port=5432;Database=valhaus;User Id=valhaus_user;Password=valhaus_password_change_me;
      # Add your Stripe keys here for local testing
      - Stripe__Secretkey=${STRIPE_SECRET_KEY:-}
      - Stripe__Publishablekey=${STRIPE_PUBLISHABLE_KEY:-}
      # Add your Google OAuth credentials here for local testing
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount wwwroot for development (optional - remove for production-like testing)
      - ./VALHÄUS/wwwroot:/app/wwwroot:ro

volumes:
  postgres_data:
    driver: local

# Usage:
# 1. For local development: docker-compose up --build
# 2. To run migrations: docker-compose exec web dotnet ef database update
# 3. To stop: docker-compose down
# 4. To stop and remove data: docker-compose down -v
